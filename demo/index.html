<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>localOCR demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="top">
    <b>localOCR</b>
    <span>Images and image-only PDFs to editable documents. Runs in this tab; nothing is uploaded.</span>
  </header>
  <main>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*,application/pdf" hidden>
      <strong>Drop an image or PDF</strong>
      <span>or click to choose. A screenshot, a scan, a slide deck…</span>
    </label>
    <div class="options">
      <label><input type="checkbox" id="pictures" checked> Cut out pictures, charts and drawings</label>
    </div>
    <p class="status" id="status" hidden></p>

    <section class="result" id="result" hidden>
      <div class="actions">
        <button type="button" data-export="editable">Editable PDF</button>
        <button type="button" data-export="searchable">Searchable PDF</button>
        <button type="button" data-export="pptx">PowerPoint</button>
        <button type="button" data-export="json">JSON</button>
        <button type="button" data-export="text">Text</button>
      </div>
      <div class="views">
        <figure><figcaption>Original</figcaption><div id="original" class="page"></div></figure>
        <figure><figcaption>Rebuilt from editable parts (click text to edit)</figcaption><div id="rebuilt" class="page"></div></figure>
      </div>
      <h2>Text</h2>
      <pre id="text"></pre>
    </section>
  </main>
  <script src="../src/localocr.js"></script>
  <script src="demo.js"></script>
</body>
</html>
